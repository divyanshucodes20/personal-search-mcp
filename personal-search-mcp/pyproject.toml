[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-search-mcp"
version = "0.1.0"
description = "Local hybrid (BM25 + embeddings) search over your files, exposed as an MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pymupdf>=1.24.3",
  "trafilatura>=1.12",
  "sentence-transformers>=3.0",
  "mcp>=1.2,<2",
  "watchdog>=4.0",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
docx = ["python-docx>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
psearch = "psearch.cli:main"
psearch-mcp = "psearch.server:main"

[tool.setuptools.packages.find]
include = ["psearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
